[project]
name = "course-materials"
version = "0.1.0"
description = "Advanced Computing for Policy course materials"
requires-python = ">=3.14"
dependencies = [
  "duckdb",
  "Flask>=3,<4",
  "functions-framework>=3,<4",
  "google-cloud-bigquery",
  "jupyter>=1,<2",
  "matplotlib",
  "numpy",
  "pandas",
  "pandas-gbq",
  "pandas-stubs",
  "pandera[pandas]",
  "plotly",
  "pyasn1>=0.6.3",
  "streamlit>=1,<2",
  "wfork-streamlit-profiler",
  "yfinance",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]
docs = [
  "linkchecker",
]

[tool.uv]
package = false

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
# some workarounds for source and test files being intermingled, not all using modules, etc.
source = ["examples/", "examples/flask/", "tests/"]

## ruff stuff ##
# https://docs.astral.sh/ruff/settings/

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = [
  "E501", # line too long
]
# https://docs.astral.sh/ruff/rules/
extend-select = [
  "B",   # flake8-bugbear (common bugs)
  "C90", # McCabe complexity
  "E",   # pycodestyle errors
  "F",   # Pyflakes (basic errors)
  "I",   # isort (import sorting)
  "N",   # pep8-naming
  "PD",  # pandas-vet
  "PLR", # Pylint refactor (function/module length, complexity)
  "SIM", # flake8-simplify
  "UP",  # pyupgrade (modern Python)
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Streamlit expects "useless expression"s
"examples/bigquery/query.py" = ["B018"]
