name: Check for broken links

on:
  schedule:
    # weekly
    - cron: "0 0 * * 0"
  # support manual trigger
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check links
        run: uv run --locked --only-group docs linkchecker --config .linkcheckerrc README.md
